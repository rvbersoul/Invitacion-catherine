<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>50 años de Catherine</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#efe7dc;
font-family:Georgia, serif;
display:flex;
justify-content:center;
padding:40px 20px;
}

.container{
max-width:650px;
width:100%;
text-align:center;
}

img{
width:100%;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.18);
display:block;
}

h1{
font-size:42px;
color:#6b3fa0;
margin:35px 0 10px;
font-weight:normal;
}

h2{
font-size:22px;
color:#555;
font-weight:normal;
margin-bottom:35px;
}

.boton{
display:inline-block;
margin-top:15px;
padding:18px 42px;
background:#7d4ab4;
color:white;
text-decoration:none;
font-size:22px;
border-radius:50px;
transition:.25s;
}

.boton:hover{
background:#633494;
transform:scale(1.03);
}

footer{
margin-top:45px;
color:#777;
font-size:16px;
line-height:1.7;
}

</style>

</head>

<body>

<div class="container">

<img src="invitacion.jpg" alt="Invitación">

<h1>¡Los espero!</h1>

<h2>Confirma tu asistencia haciendo clic aquí.</h2>

<a class="boton" href="https://forms.gle/REEMPLAZAREMOS_ESTO">
Confirmar asistencia
</a>

<footer>
Con mucho cariño ❤️<br>
Catherine
</footer>

</div>

</body>
</html>
